<!DOCTYPE html>
<html lang="uk" data-theme="dark" data-accent="lime">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Fitness Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap&subset=cyrillic" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#121212; --card:rgba(255,255,255,.055); --card-b:rgba(255,255,255,.11);
  --text:#f2f2ee; --muted:#9a9a94; --acc:#CCFF00; --acc-ink:#CCFF00; --on-acc:#0b0b0b;
  --body:rgba(255,255,255,.14); --muscle-off:rgba(255,255,255,.09);
  --glow:rgba(204,255,0,.13); --glow2:rgba(120,140,255,.08); --panel:#1b1b1b;
}
[data-accent="orange"]{--acc:#FF5500;--acc-ink:#FF5500;--glow:rgba(255,85,0,.16)}
[data-theme="light"]{
  --bg:#f3f1ea; --card:rgba(255,255,255,.72); --card-b:rgba(0,0,0,.12);
  --text:#121212; --muted:#5f5f58; --acc-ink:#4d6300;
  --body:rgba(0,0,0,.15); --muscle-off:rgba(0,0,0,.08); --glow2:rgba(80,100,255,.06); --panel:#fff;
}
[data-theme="light"][data-accent="orange"]{--acc-ink:#c13e00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
.app{font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.5;margin:0;transition:background .3s,color .3s}
.app::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(620px 420px at 88% -5%,var(--glow),transparent 70%),radial-gradient(520px 420px at -10% 45%,var(--glow2),transparent 70%)}
.display{font-family:'Unbounded','Manrope',sans-serif;letter-spacing:-.02em}
button{font-family:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
i[data-lucide],svg.lucide{width:1.15em;height:1.15em;stroke-width:2.2;flex:none}

/* layout */
.topbar{position:sticky;top:0;z-index:40;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:color-mix(in srgb,var(--bg) 72%,transparent);border-bottom:1px solid var(--card-b)}
.topbar-in{max-width:1080px;margin:0 auto;padding:.7rem 1rem;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:.6rem;font-weight:800}
.logo-mark{width:36px;height:36px;border-radius:11px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;transform:rotate(-6deg)}
.logo b{font-family:'Unbounded',sans-serif;font-size:1rem;letter-spacing:-.02em}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--card-b);background:var(--card);display:grid;place-items:center;transition:.2s}
.icon-btn:hover{border-color:var(--acc);color:var(--acc-ink);transform:translateY(-2px)}
.tools{display:flex;align-items:center;gap:.5rem}
.seg{display:inline-flex;padding:3px;border-radius:14px;border:1px solid var(--card-b);background:var(--card);gap:2px}
.seg-b{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .7rem;border:0;border-radius:11px;background:transparent;font-weight:800;font-size:.8rem;color:var(--muted);transition:.2s}
.seg-b:hover{color:var(--text)}
.seg-b.on{background:var(--acc);color:var(--on-acc);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.seg-b.dot{padding:.45rem}
.seg-b .sw{display:block;width:18px;height:18px;border-radius:50%;border:2px solid rgba(0,0,0,.35)}
.seg-b.dot.on{box-shadow:0 0 0 2px var(--acc)}
.seg-b.dot.on{background:transparent}
@media(max-width:560px){.topbar-in{flex-wrap:wrap;row-gap:.5rem}.tools{width:100%;justify-content:space-between}.seg-b{padding:.5rem .75rem}.seg-b.dot{padding:.5rem}.tabs{top:104px}}
.fab-txt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1;text-align:left}
.fab-txt b{font-size:.9rem}
.fab-txt em{font-style:normal;font-size:.7rem;font-weight:700;opacity:.75}
.container{max-width:1080px;margin:0 auto;padding:1.2rem 1rem 7rem}
.glass{background:var(--card);border:1px solid var(--card-b);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:20px}

/* stepper */
.stepper{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:1.6rem}
.st-line{position:absolute;top:19px;left:16.66%;width:66.66%;height:3px;background:var(--card-b);border-radius:3px;overflow:hidden}
.st-line i{display:block;height:100%;background:var(--acc);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.st{position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:.35rem;padding:0}
.st span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--bg);border:2px solid var(--card-b);color:var(--muted);transition:.3s}
.st em{font-style:normal;font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.st.cur span{background:var(--acc);border-color:var(--acc);color:var(--on-acc);box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 22%,transparent)}
.st.cur em{color:var(--text)}
.st.done span{border-color:var(--acc);color:var(--acc-ink)}
.st:not(:disabled):hover span{transform:scale(1.08)}

/* typography */
.h1{font-family:'Unbounded',sans-serif;font-weight:800;font-size:clamp(1.7rem,6.2vw,3rem);line-height:1.05;letter-spacing:-.03em;margin:0}
.h2{font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(1.2rem,4.2vw,1.7rem);line-height:1.15;margin:0}
.acc{color:var(--acc-ink)}
.lead{color:var(--muted);font-size:1rem;max-width:560px;margin:.8rem 0 0}
.kicker{display:inline-flex;align-items:center;gap:.4rem;font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--acc-ink)}
.sec-title{font-weight:800;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:1.6rem 0 .7rem;display:flex;align-items:center;gap:.5rem}
.sec-title::after{content:'';flex:1;height:1px;background:var(--card-b)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.9rem 1.3rem;border-radius:14px;font-weight:800;border:2px solid transparent;transition:transform .15s,box-shadow .15s,background .2s,border-color .2s;font-size:.95rem}
.btn-primary{background:var(--acc);color:var(--on-acc)}
.btn-primary:not(:disabled):hover{transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--text)}
.btn-primary:not(:disabled):active{transform:none;box-shadow:none}
.btn-ghost{background:transparent;border-color:var(--card-b);color:var(--text)}
.btn-ghost:hover{border-color:var(--acc);color:var(--acc-ink);transform:translateY(-2px)}
.btn-sm{padding:.55rem .85rem;font-size:.82rem;border-radius:11px}
.nav-row{display:flex;justify-content:space-between;align-items:center;gap:.8rem;margin-top:2rem}

/* options */
.opt{position:relative;display:flex;align-items:center;gap:.85rem;text-align:left;padding:1rem 1.1rem;border-radius:18px;border:2px solid var(--card-b);background:var(--card);transition:.2s;width:100%}
.opt:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--acc) 60%,var(--card-b))}
.opt .oi{width:46px;height:46px;border-radius:14px;background:var(--body);display:grid;place-items:center;font-size:1.3rem;flex:none;transition:.2s}
.opt .ot{display:flex;flex-direction:column;min-width:0}
.opt .ot b{font-weight:800}
.opt .ot small{color:var(--muted);font-size:.8rem;line-height:1.35;margin-top:.1rem}
.opt .ck{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-size:.7rem;opacity:0;transform:scale(.4);transition:.2s}
.opt.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 11%,var(--card))}
.opt.sel .oi{background:var(--acc);color:var(--on-acc)}
.opt.sel .ck{opacity:1;transform:none}
.opt.big{flex-direction:column;align-items:flex-start;padding:1.5rem;gap:1rem;min-height:190px;justify-content:space-between}
.opt.big .oi{width:64px;height:64px;font-size:1.9rem;border-radius:18px}
.opt.big .ot b{font-size:1.35rem;font-family:'Unbounded',sans-serif}
.opt.locked{opacity:.85;cursor:default}
.opt.locked:hover{transform:none}
.opt.sm{padding:.7rem .9rem;border-radius:14px}
.opt.sm .oi{width:34px;height:34px;font-size:1rem;border-radius:10px}
.pill{min-width:58px;padding:.7rem 1rem;border-radius:13px;border:2px solid var(--card-b);background:var(--card);font-weight:800;transition:.2s}
.pill:hover{border-color:var(--acc);transform:translateY(-2px)}
.pill.sel{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.pills{display:flex;flex-wrap:wrap;gap:.5rem}
.grid2{display:grid;gap:.8rem;grid-template-columns:1fr}
.grid3{display:grid;gap:.8rem;grid-template-columns:1fr}
.grid4{display:grid;gap:.8rem;grid-template-columns:1fr 1fr}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}.grid4{grid-template-columns:repeat(4,1fr)}}

/* fields */
.field{display:flex;flex-direction:column;gap:.35rem}
.field label{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inwrap{position:relative}
.inwrap input,.txt{width:100%;background:var(--card);border:2px solid var(--card-b);border-radius:14px;padding:.85rem 3.2rem .85rem 1rem;font:inherit;font-weight:700;font-size:1.05rem;color:var(--text);outline:none;transition:.2s}
.txt{padding:.85rem 1rem;font-weight:500;font-size:.95rem}
.inwrap input:focus,.txt:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
.inwrap span{position:absolute;right:1rem;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;font-size:.85rem;pointer-events:none}
.field.invalid input{border-color:#ff4d4d}
.err{color:#ff6b6b;font-size:.78rem;font-weight:700;min-height:0}
.err:empty{display:none}

/* hero / loader */
.hero{margin-bottom:1.6rem}
.banner{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;justify-content:space-between;padding:1rem 1.2rem;margin-bottom:1.4rem;border-color:var(--acc)}
.panel-in{padding:1.1rem;margin-top:1rem}
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;min-height:55vh;text-align:center}
.loader .bell{width:92px;height:92px;border-radius:26px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-size:2.6rem;animation:lift 1s ease-in-out infinite}
@keyframes lift{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-16px) rotate(6deg)}}
.enter{animation:enter .5s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* results */
.res-head{display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;align-items:flex-start;padding:1.3rem}
.head-actions{display:flex;flex-wrap:wrap;gap:.5rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:.9rem}
@media(min-width:720px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:.9rem 1rem}
.stat small{display:block;color:var(--muted);font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.stat b{font-family:'Unbounded',sans-serif;font-size:1.35rem}
.stat em{display:block;font-style:normal;color:var(--muted);font-size:.75rem}
.note{padding:.8rem 1rem;border-radius:14px;border:1px dashed var(--card-b);color:var(--muted);font-size:.85rem;margin-top:.8rem}
.week{display:grid;grid-template-columns:repeat(7,minmax(78px,1fr));gap:.45rem;overflow-x:auto;padding-bottom:.3rem;scrollbar-width:thin}
.wcell{display:flex;flex-direction:column;gap:.15rem;text-align:left;padding:.7rem;border-radius:14px;border:2px solid var(--card-b);background:var(--card);min-height:84px;transition:.2s}
.wcell b{font-size:.8rem;font-weight:800}
.wcell em{font-style:normal;font-size:.68rem;font-weight:800;color:var(--acc-ink);text-transform:uppercase;letter-spacing:.05em}
.wcell span{font-size:.72rem;color:var(--muted);line-height:1.25}
.wcell.rest{opacity:.5;border-style:dashed}
button.wcell:hover{transform:translateY(-3px);border-color:var(--acc)}
.wcell.sel{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.wcell.sel em,.wcell.sel span{color:var(--on-acc)}
.tabs{display:flex;gap:.5rem;overflow-x:auto;padding:.2rem 0 .6rem;scrollbar-width:none;position:sticky;top:60px;z-index:20;background:linear-gradient(var(--bg) 70%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:.65rem 1.05rem;border-radius:13px;border:2px solid var(--card-b);background:var(--card);font-weight:800;font-size:.85rem;transition:.2s}
.tab:hover{border-color:var(--acc)}
.tab.sel{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.day-panel{display:none}
.day-panel.active{display:block;animation:enter .4s cubic-bezier(.2,.8,.2,1)}
.day-head{padding:1.2rem;margin-bottom:1rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.mtag{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:800;padding:.22rem .6rem;border-radius:99px;background:color-mix(in srgb,var(--c) 22%,transparent);border:1px solid var(--c)}
.mtag.sec{background:transparent;border-style:dashed;font-weight:600;opacity:.85}
.mtag::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--c)}
.bar{height:9px;border-radius:9px;background:var(--body);overflow:hidden;margin-top:.9rem}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
.small-muted{color:var(--muted);font-size:.82rem}
.cards{display:grid;gap:1rem;grid-template-columns:1fr}
@media(min-width:900px){.cards{grid-template-columns:1fr 1fr}}
.ex-card{padding:1.1rem;display:flex;flex-direction:column;gap:.9rem;transition:transform .2s,border-color .2s}
.ex-card:hover{border-color:color-mix(in srgb,var(--acc) 55%,var(--card-b))}
.ex-top{display:flex;gap:.8rem;align-items:flex-start}
.ex-num{width:38px;height:38px;border-radius:12px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-family:'Unbounded',sans-serif;font-weight:800;flex:none}
.ex-top h3{margin:0;font-size:1.08rem;font-weight:800;line-height:1.25}
.ex-top .en{margin:.1rem 0 0;color:var(--muted);font-size:.8rem;font-weight:600}
.ex-media{display:grid;grid-template-columns:1.55fr 1fr;gap:.6rem}
.anim,.mmap{border-radius:14px;background:var(--body);padding:.4rem;position:relative;overflow:hidden}
.anim{background:linear-gradient(160deg,var(--body),transparent)}
.anim svg,.mmap svg{width:100%;height:100%;display:block}
.anim small{position:absolute;left:8px;bottom:5px;font-size:.62rem;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.params{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.pbox{border-radius:13px;border:1px solid var(--card-b);padding:.55rem .4rem;text-align:center;background:var(--body)}
.pbox small{display:block;font-size:.62rem;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.pbox b{font-family:'Unbounded',sans-serif;font-size:1.12rem;color:var(--acc-ink)}
.setrow{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.setrow>small{color:var(--muted);font-weight:700;font-size:.75rem}
.setpill{width:40px;height:40px;border-radius:50%;border:2px solid var(--card-b);background:transparent;font-weight:800;transition:.2s}
.setpill:hover{border-color:var(--acc)}
.setpill.done{background:var(--acc);border-color:var(--acc);color:var(--on-acc);transform:scale(1.05)}
.actions{display:flex;gap:.5rem;flex-wrap:wrap}
.actions .btn{flex:1;min-width:120px}
.det{border-top:1px dashed var(--card-b);padding-top:.7rem}
.det summary{cursor:pointer;font-weight:800;font-size:.85rem;list-style:none;display:flex;justify-content:space-between;align-items:center}
.det summary::-webkit-details-marker{display:none}
.det summary::after{content:'▾';transition:.2s;color:var(--muted)}
.det[open] summary::after{transform:rotate(180deg)}
.det ol{margin:.6rem 0 0;padding-left:1.2rem;font-size:.9rem}
.det li{margin-bottom:.3rem}
.det li::marker{color:var(--acc-ink);font-weight:800}
.safety{margin-top:.6rem;padding:.7rem .85rem;border-radius:12px;background:color-mix(in srgb,#ff8a00 14%,transparent);border:1px solid color-mix(in srgb,#ff8a00 55%,transparent);font-size:.84rem;display:flex;gap:.55rem}
.safety i,.safety svg{color:#ff9d2e;margin-top:.15rem}
.tip{padding:1.1rem 1.2rem;margin-top:1.5rem}
.tip ul{margin:.5rem 0 0;padding-left:1.2rem;font-size:.88rem;color:var(--muted)}
.tip li{margin-bottom:.25rem}
.print-only{display:none}

/* timer */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;min-width:58px;height:58px;padding:0 1rem;border-radius:20px;border:2px solid #000;background:var(--acc);color:var(--on-acc);display:flex;align-items:center;justify-content:center;gap:.5rem;font-weight:800;box-shadow:4px 4px 0 rgba(0,0,0,.55);transition:.15s}
.fab:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 rgba(0,0,0,.55)}
.fab svg,.fab i{width:1.5rem;height:1.5rem}
.fab.done,.tpanel.done{animation:flash .5s ease-in-out 6}
@keyframes flash{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--acc) 45%,transparent)}}
.tpanel{position:fixed;left:50%;bottom:0;z-index:70;width:min(430px,100%);transform:translate(-50%,110%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding:1.1rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));border-radius:26px 26px 0 0;background:var(--panel);border-color:var(--acc)}
.tpanel.open{transform:translate(-50%,0)}
.t-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.t-kick{font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--acc-ink)}
.t-label{font-weight:800;font-size:.95rem}
.ring{position:relative;width:176px;height:176px;margin:.6rem auto}
.ring svg{width:100%;height:100%}
.ring-bg{fill:none;stroke:var(--body);stroke-width:10}
.ring-fg{fill:none;stroke:var(--acc);stroke-width:10;stroke-linecap:round;stroke-dasharray:439.82;stroke-dashoffset:0;transition:stroke-dashoffset .25s linear}
.t-time{position:absolute;inset:0;display:grid;place-items:center;font-family:'Unbounded',sans-serif;font-weight:800;font-size:2.1rem}
.presets{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap}
.presets button{padding:.4rem .7rem;border-radius:10px;border:1px solid var(--card-b);background:var(--card);font-weight:800;font-size:.8rem}
.presets button:hover{border-color:var(--acc)}
.t-ctrl{display:flex;justify-content:center;gap:.6rem;margin:.9rem 0 .5rem}
.t-ctrl .btn{padding:.75rem 1rem}
.t-opts{display:flex;justify-content:center;gap:1.2rem;font-size:.8rem;color:var(--muted);font-weight:600}
.t-opts input{accent-color:var(--acc);margin-right:.3rem}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,30px);opacity:0;z-index:90;background:var(--acc);color:var(--on-acc);font-weight:800;padding:.7rem 1.1rem;border-radius:14px;box-shadow:4px 4px 0 rgba(0,0,0,.5);transition:.3s;pointer-events:none;max-width:90vw;text-align:center;font-size:.9rem}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:480px){.ex-media{grid-template-columns:1.35fr 1fr}.opt.big{min-height:150px}}

/* print */
@media print{
  html,html[data-theme],html[data-accent]{--bg:#fff;--text:#000;--muted:#444;--card:#fff;--card-b:#bbb;--acc:#222;--acc-ink:#000;--on-acc:#fff;--body:#e6e6e6;--muscle-off:#eee;--panel:#fff}
  .app::before{display:none}
  .no-print,.fab,.tpanel,.topbar,.stepper,.tabs,.toast,.actions,.setrow,.week,.sec-week{display:none!important}
  .print-only{display:block!important;margin-bottom:1rem}
  .container{padding:0}
  .glass{backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
  .day-panel{display:block!important;page-break-after:always;animation:none}
  .ex-card{break-inside:avoid}
  .cards{grid-template-columns:1fr 1fr}
  .det{display:block}
}

function dayPlan(c){
  const L=c.level,d=c.days,g=c.goal;
  if(d===2) return ['fullA','fullB'];
  if(d===3) return L==='beginner'?['fullA','fullB','fullC']:['push','pull','legs'];
  if(d===4) return (L==='beginner'||g==='strength')?['upper','lower','upper','lower']:['chestTri','backBi','legsGl','shCore'];
  return L==='beginner'?['fullA','upper','lower','fullB','fullC']:['chestTri','backBi','legsGl','shCore','fullC'];
}
const okEquip=(ex,c)=>c.location==='gym'||ex.eq==='bw'||c.equip.includes(ex.eq);
const okRisk=(ex,c)=>!ex.risks.some(r=>c.limits.includes(r))&&!(c.age>=50&&ex.risks.includes('impact'));
function candidates(m,t,c,relax){
  const maxL=c.lvl+(relax>=2?1:0);
  return DB.filter(ex=>!ex.steady&&ex.prim.includes(m)&&(relax>=1||t==='a'||ex.type===t)&&ex.lvl<=maxL&&okEquip(ex,c)&&okRisk(ex,c));
}
const famOf=ex=>ex.move+'|'+ex.prim[0];
function score(ex,c,used,moves,first,m){
  let s=Math.random()*1.7;
  if(c.location==='gym') s+={gym:1.2,db:.6,kb:0,bar:0,band:-1.5,bw:-.4}[ex.eq]||0; else s+={db:.5,bar:.5,kb:.3,band:0,bw:0}[ex.eq]||0;
  s-=(used[ex.id]||0)*2.6; s-=(moves[ex.move]||0)*.9;
  if(ex.lvl===c.lvl) s+=.4; if(ex.prim[0]===m) s+=.5; if(first) s+=ex.lvl*.15+(ex.type==='c'?.3:0);
  return s;
}
function pick(m,t,c,used,inDay,moves,first,fams){
  for(const strict of (t==='a'?[true]:[true,false])) for(let relax=0;relax<3;relax++){
    const list=candidates(m,t,c,relax).filter(ex=>!inDay.has(ex.id)&&(!strict||!fams.has(famOf(ex))));
    if(list.length) return list.map(ex=>({ex,s:score(ex,c,used,moves,first,m)})).sort((a,b)=>b.s-a.s)[0].ex;
  }
  return null;
}
function pickMachine(c,used,inDay,exclude){
  const list=DB.filter(ex=>ex.steady&&okEquip(ex,c)&&okRisk(ex,c)&&ex.lvl<=c.lvl+1&&!inDay.has(ex.id)&&!exclude.has(ex.id));
  if(!list.length) return null;
  return list.map(ex=>({ex,s:Math.random()*2-(used[ex.id]||0)*2.6})).sort((a,b)=>b.s-a.s)[0].ex;
}
function params(ex,c,role){
  const g=c.goal; let {sets,reps,rest}={...GOALS[g][ex.type]}; let isTime=false;
  if(ex.steady){
    const fin=role==='fin', lo=fin?(c.level==='beginner'?10:12):(c.level==='beginner'?5:6), hi=lo+(fin?5:4);
    return {sets:1,reps:`${lo}-${hi} хв`,rest:0,isTime:true,steady:true,mins:(lo+hi)/2,role:fin?'fin':'warm'};
  }
  if(HOLD.includes(ex.id)){ reps=c.level==='beginner'?'20-30 с':c.level==='medium'?'30-45 с':'45-60 с'; sets=Math.max(2,Math.min(sets,3)); rest=Math.min(rest,45); isTime=true; }
  else if(ex.prim.includes('cardio')){ sets=c.level==='advanced'?4:3; reps='30-40 с'; rest=30; isTime=true; }
  else if(ex.prim[0]==='core'){ reps=g==='strength'?'10-15':'15-20'; sets=Math.min(sets,3); rest=Math.min(rest,45); }
  else if(ex.prim[0]==='calves'){ reps='15-20'; sets=Math.min(sets,4); rest=Math.min(rest,45); }
  else if((ex.eq==='bw'||ex.eq==='bar')&&ex.type==='c'){ if(g==='strength') reps='6-10'; else if(g==='mass') reps='8-15'; }
  if(!isTime){
    if(c.level==='beginner') sets=Math.max(2,sets-1);
    if(c.level==='advanced'&&ex.type==='c'&&(g==='mass'||g==='strength')) sets=Math.min(5,sets+1);
    if(c.level==='beginner'&&g==='strength'&&ex.type==='c'&&!['bw','bar'].includes(ex.eq)) reps='5-8';
  }
  if(c.duration<=30) sets=Math.max(2,sets-1);
  if(c.age>=50) rest+=15;
  return {sets,reps,rest,isTime};
}
const exTime=p=>p.steady?p.mins+.5:p.sets*((p.isTime?45:40)+p.rest)/60+.8;

    const T=TEMPLATES[key], inDay=new Set(), moves={}, items=[], fams=new Set(), machines=new Set();
    let total=0; const avail=c.duration-6-(c.goal==='fat'?5:0);
    const uniq=[...new Set(T.slots.map(s=>s[0]))];
    const slots=T.slots.slice(); for(let r=0;r<14;r++) slots.push([uniq[r%uniq.length],'a']);
    const add=(ex,m,t,role)=>{const par=params(ex,c,role); items.push({id:ex.id,...par,slotM:m,slotT:t}); inDay.add(ex.id); fams.add(famOf(ex)); moves[ex.move]=(moves[ex.move]||0)+1; used[ex.id]=(used[ex.id]||0)+1; total+=exTime(par);};
    if(c.location==='gym'){ const wu=pickMachine(c,used,inDay,machines); if(wu){ machines.add(wu.id); add(wu,'cardio','a','warm'); } }
    const base=items.length;
    for(const [m,t] of slots){
      if(items.length>=10+base) break;
      const ex=pick(m,t,c,used,inDay,moves,items.length===base,fams); if(!ex) continue;
      if(items.length>=4+base&&total+exTime(params(ex,c))>avail+1.5) continue;
      add(ex,m,t);
    }
    if(c.goal==='fat'){
      const cx=c.location==='gym'?pickMachine(c,used,inDay,machines):pick('cardio','a',c,used,inDay,moves,false,fams);
      if(cx) add(cx,'cardio','a',c.location==='gym'?'fin':undefined);
    }
    return {key,name:T.name,short:T.short,wd:wds[i],items,timeMin:Math.round(total+6)};
  });
  return {created:Date.now(),ctx:c,days,stats:calcStats(c)};
}
function calcStats(c){
  const bmi=c.weight/Math.pow(c.height/100,2);
  const cat=bmi<18.5?'Дефіцит ваги':bmi<25?'Норма':bmi<30?'Надлишок ваги':'Ожиріння';
  const bmr=10*c.weight+6.25*c.height-5*c.age+(c.gender==='male'?5:-161);
  const act={2:1.375,3:1.45,4:1.55,5:1.65}[c.days];
  const kcal=Math.round(bmr*act*{mass:1.1,fat:.8,strength:1.05,health:1}[c.goal]/10)*10;
  const protein=Math.round(c.weight*{mass:1.8,fat:2,strength:1.8,health:1.4}[c.goal]);
  return {bmi:bmi.toFixed(1),cat,kcal,protein};
}
function swapAlternative(c,day,item){
  const cur=DB_BY_ID[item.id], m=cur.prim[0];
  const inDay=new Set(day.items.map(i=>i.id)); const inProg=new Set(state.program.days.flatMap(d=>d.items.map(i=>i.id)));
  if(cur.steady){
    let list=DB.filter(ex=>ex.steady&&okEquip(ex,c)&&okRisk(ex,c)&&ex.lvl<=c.lvl+1&&!inDay.has(ex.id)&&ex.id!==cur.id);
    const fresh=list.filter(ex=>!inProg.has(ex.id)); if(fresh.length) list=fresh;
    return list.length?list[Math.floor(Math.random()*list.length)]:null;
  }
  const dayFams=new Set(day.items.filter(i=>i.id!==cur.id).map(i=>famOf(DB_BY_ID[i.id])));
  for(let relax=0;relax<3;relax++){
    let list=candidates(m,item.slotT==='a'?'a':cur.type,c,relax).filter(ex=>!inDay.has(ex.id)&&ex.id!==cur.id);
    if(!list.length) continue;
    const diff=list.filter(ex=>!dayFams.has(famOf(ex))); if(diff.length) list=diff;
    const fresh=list.filter(ex=>!inProg.has(ex.id)); if(fresh.length) list=fresh;
    return list[Math.floor(Math.random()*list.length)];
  }
  return null;
}

}
function showErrors(err){
  ['gender','age','weight','height','goal'].forEach(k=>{const el=$('#err-'+k); if(el) el.textContent=err[k]||''; const fl=$('#fld-'+k); if(fl) fl.classList.toggle('invalid',!!err[k]);});
  const first=['gender','age','weight','height','goal'].find(k=>err[k]);
  if(first){ const el=$('#err-'+first); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); toast('Заповни обов’язкові поля'); }
}
function startGenerate(){
  const v=$('#view'); v.innerHTML=loaderView(); refreshIcons(); window.scrollTo({top:0,behavior:'smooth'});
  const msgs=['Аналізуємо анкету…','Підбираємо вправи під обладнання…','Враховуємо обмеження та рівень…','Розраховуємо підходи та відпочинок…','Збираємо розклад на тиждень…'];
  let i=0; const iv=setInterval(()=>{i=(i+1)%msgs.length;const m=$('#loadMsg');if(m)m.textContent=msgs[i];},420);
  setTimeout(()=>{
    clearInterval(iv);
    state.program=generate(buildCtx(state.form)); state.progress={}; state.activeDay=0; state.max=3;
    setStep(3);
  },1700);
}

/* ============================================================
   ОБРОБНИК ПОДІЙ
============================================================ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const act=t.dataset.act, f=state.form, v=t.dataset.v;
  switch(act){
    case 'loc': f.location=v; if(v==='gym') f.equip=[]; save(); render(false); break;
    case 'equip': f.equip=f.equip.includes(v)?f.equip.filter(x=>x!==v):[...f.equip,v]; render(false); break;
    case 'gender': f.gender=v; render(false); break;
    case 'level': f.level=v; render(false); break;
    case 'goal': f.goal=v; render(false); break;
    case 'days': f.days=+v; render(false); break;
    case 'dur': f.duration=+v; render(false); break;
    case 'limit': f.limits=f.limits.includes(v)?f.limits.filter(x=>x!==v):[...f.limits,v]; render(false); break;
    case 'next': if(state.step===1&&f.location) setStep(2); break;
    case 'back': setStep(Math.max(1,state.step-1)); break;
    case 'goto': { const s=+t.dataset.s; if(s===3&&!state.program) break; setStep(s); break; }
    case 'gen': { const err=validate(); if(Object.keys(err).length){showErrors(err);break;} save(); startGenerate(); break; }
    case 'edit': setStep(2); break;
    case 'resume': { const sv=state.saved; state.program=sv.program; state.progress=sv.progress||{}; state.activeDay=Math.min(sv.activeDay||0,sv.program.days.length-1); state.max=3; setStep(3); break; }
    case 'regen': state.program=generate(state.program.ctx); state.progress={}; state.activeDay=0; save(); render(true); window.scrollTo({top:0,behavior:'smooth'}); toast('Програму перегенеровано'); break;
    case 'reset': if(confirm('Почати спочатку? Збережену програму буде видалено.')){ state.form=defaultForm(); state.program=null; state.progress={}; state.activeDay=0; state.max=1; state.saved=null; try{localStorage.removeItem(LS);}catch(e){} setStep(1);} break;
    case 'print': window.print(); break;
    case 'tab': {
      const i=+t.dataset.i; state.activeDay=i;
      $$('.day-panel').forEach(p=>p.classList.toggle('active',+p.dataset.d===i));
      $$('.tab').forEach((b,k)=>b.classList.toggle('sel',k===i));
      $('#weekWrap').innerHTML=weekStrip(state.program);
      if(t.dataset.scroll||t.classList.contains('tab')) $('#tabs').scrollIntoView({behavior:'smooth',block:'start'});
      save(); break;
    }
    case 'set': {
      const d=+t.dataset.d, ei=+t.dataset.e, k=+t.dataset.k, key=`${d}-${ei}`, it=state.program.days[d].items[ei];
      const cur=state.progress[key]||0, nv=(k===cur)?k-1:k; state.progress[key]=nv;
      $$('.setpill',t.closest('.setrow')).forEach((b,idx)=>b.classList.toggle('done',idx<nv));
      updateProgress(d); save();
      if(nv>cur){ if(nv<it.sets){ if($('#optAuto').checked) Timer.start(it.rest,DB_BY_ID[it.id].uk); } else toast('Вправу завершено — відмінно! 💪'); }
      break;
    }
    case 'rest': { const it=state.program.days[+t.dataset.d].items[+t.dataset.e]; Timer.start(it.rest,DB_BY_ID[it.id].uk); break; }
    case 'swap': {
      const d=+t.dataset.d, ei=+t.dataset.e, day=state.program.days[d], it=day.items[ei];
      const alt=swapAlternative(state.program.ctx,day,it);
      if(!alt){ toast('Для цієї вправи альтернатив не знайдено'); break; }
      const par=params(alt,state.program.ctx,it.role);
      day.items[ei]={id:alt.id,...par,slotM:it.slotM,slotT:it.slotT}; state.progress[`${d}-${ei}`]=0;
      const sec=$(`#day-${d}`); const wasActive=sec.classList.contains('active');
      sec.outerHTML=dayPanel(d); const ns=$(`#day-${d}`); if(!wasActive) ns.classList.remove('active'); ns.classList.remove('active'); if(+state.activeDay===d) ns.classList.add('active');
      refreshIcons(); updateProgress(d); save();
      $(`.ex-card[data-d="${d}"][data-e="${ei}"]`).scrollIntoView({behavior:'smooth',block:'center'});
      toast('Вправу замінено: '+alt.uk); break;
    }
    case 'theme-set': { document.documentElement.dataset.theme=v; try{localStorage.setItem('forge_theme',v);}catch(e){} syncTheme(); toast(v==='dark'?'Темна тема':'Світла тема'); break; }
    case 'accent-set': { document.documentElement.dataset.accent=v; try{localStorage.setItem('forge_accent',v);}catch(e){} syncTheme(); break; }
    case 'timer-toggle': $('#timerPanel').classList.contains('open')?Timer.close():Timer.open(); break;
    case 'timer-close': Timer.close(); break;
    case 'tpreset': Timer.set(+t.dataset.s); break;
    case 'tplay': Timer.toggle(); break;
    case 'treset': Timer.reset(); break;
    case 'tadd': Timer.add(+t.dataset.s); break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target; if(!t.dataset||!t.dataset.field) return;
  state.form[t.dataset.field]=t.value;
  const fl=$('#fld-'+t.dataset.field); if(fl) fl.classList.remove('invalid'); const er=$('#err-'+t.dataset.field); if(er) er.textContent='';
  save();
});

/* ============================================================
   ТЕМА
============================================================ */
function syncTheme(){
  const dark=document.documentElement.dataset.theme==='dark';
  const ac=document.documentElement.dataset.accent;
  $('#thDark').classList.toggle('on',dark); $('#thLight').classList.toggle('on',!dark);
  $('#thDark').setAttribute('aria-pressed',dark); $('#thLight').setAttribute('aria-pressed',!dark);
  $('#acLime').classList.toggle('on',ac==='lime'); $('#acOrange').classList.toggle('on',ac==='orange');
  const m=document.querySelector('meta[name=theme-color]'); if(m) m.content=dark?'#121212':'#f3f1ea';
}

/* ============================================================
   ТАЙМЕР ВІДПОЧИНКУ
============================================================ */
let ac=null;
function initAudio(){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){} }
function beep(freq,dur,when){
  if(!ac) return;
  const o=ac.createOscillator(), g=ac.createGain(), t0=ac.currentTime+when;
  o.type='sine'; o.frequency.value=freq;
  g.gain.setValueAtTime(.001,t0); g.gain.exponentialRampToValueAtTime(.45,t0+.02); g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0+dur+.05);
}
const RING=2*Math.PI*70;
const Timer={
  total:60,left:60,running:false,end:0,iv:null,label:'',_ic:null,
  open(){ $('#timerPanel').classList.add('open'); $('#timerPanel').setAttribute('aria-hidden','false'); this.ui(); },
  close(){ $('#timerPanel').classList.remove('open'); $('#timerPanel').setAttribute('aria-hidden','true'); },
  set(s){ this.total=s; this.left=s; this.running=false; clearInterval(this.iv); this.ui(); },
  start(s,label){ if(s!=null){this.total=s;this.left=s;} if(label!==undefined) this.label=label; this.open(); this.resume(); },
  resume(){ if(this.left<=0) this.left=this.total; initAudio(); this.running=true; this.end=Date.now()+this.left*1000; clearInterval(this.iv); this.iv=setInterval(()=>this.tick(),200); this.ui(); },
  pause(){ this.tick(); this.running=false; clearInterval(this.iv); this.ui(); },
  toggle(){ this.running?this.pause():this.resume(); },
  reset(){ this.running=false; clearInterval(this.iv); this.left=this.total; this.ui(); },
  add(d){ if(this.running){ this.end+=d*1000; this.left=Math.max(1,Math.ceil((this.end-Date.now())/1000)); } else this.left=Math.max(5,this.left+d); if(this.left>this.total) this.total=this.left; this.ui(); },
  tick(){ if(!this.running) return; this.left=Math.max(0,Math.ceil((this.end-Date.now())/1000)); if(this.left<=0) this.finish(); this.ui(); },
  finish(){
    this.running=false; clearInterval(this.iv); this.left=0;
    if($('#optSound').checked){ initAudio(); beep(880,.18,0); beep(880,.18,.28); beep(1175,.4,.56); }
    if(navigator.vibrate) try{navigator.vibrate([250,120,250,120,400]);}catch(e){}
    $('#timerPanel').classList.add('done'); $('#timerFab').classList.add('done');
    toast('Відпочинок завершено — наступний підхід!');
    setTimeout(()=>{$('#timerPanel').classList.remove('done');$('#timerFab').classList.remove('done');},3500);
  },
  ui(){
    $('#tTime').textContent=fmt(this.left);
    $('#ringFg').style.strokeDashoffset=RING*(1-(this.total?this.left/this.total:0));
    $('#tLabel').textContent=this.label?('Відпочинок: '+this.label):'Обери час і натисни старт';
    $('#fabTime').textContent=this.running?fmt(this.left):'відпочинок';
    document.title=this.running?`${fmt(this.left)} · Fitness Generator`:'Fitness Generator';
    if(this._ic!==this.running){ this._ic=this.running; $('#tPlay').innerHTML=ic(this.running?'pause':'play'); refreshIcons(); }
  }
};

/* ============================================================
   СТАРТ
============================================================ */
(function init(){
  try{
    const th=localStorage.getItem('forge_theme'), ac2=localStorage.getItem('forge_accent');
    if(th) document.documentElement.dataset.theme=th; if(ac2) document.documentElement.dataset.accent=ac2;
  }catch(e){}
  const sv=loadSaved();
  if(sv){ state.form={...defaultForm(),...sv.form}; if(sv.program) state.saved=sv; }
  syncTheme(); Timer.ui(); render(true);
})();
window.addEventListener('load',refreshIcons);
</script>
